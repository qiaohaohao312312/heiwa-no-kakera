<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="作品の中の小さな要素から、それぞれの平和をひらく。" />
    <title>平和とは — 無限の画布</title>
    <link rel="stylesheet" href="styles.css?v=20261128-12" />
    <script src="script.js?v=20261128-12" defer></script>
  </head>
  <body>
    <main
      class="viewport"
      tabindex="0"
      aria-label="作品の要素が散らばる画布。ドラッグして移動できます。"
    >
      <a class="session-link" href="https://piecesofpeace.studio.site/" target="_blank" rel="noopener noreferrer">戦争からつくる平和の詳細を見る</a>
      <p class="instruction" aria-hidden="true">スクロールで作品をめぐる</p>

      <div class="world" aria-label="作品の断片">
        <button class="fragment fragment--one" type="button" data-index="0" aria-label="幸せな家族を開く">
          <img src="assets/element-kazoku-group.png" alt="四人の家族" draggable="false" />
          <span class="fragment__prompt" aria-hidden="true">平和とは？</span>
        </button>
        <button class="fragment fragment--two" type="button" data-index="1" aria-label="青空を開く">
          <img src="assets/element-aozora-sky.png" alt="青いクレヨンで描かれた空" draggable="false" />
          <span class="fragment__prompt" aria-hidden="true">平和とは？</span>
        </button>
        <button class="fragment fragment--three" type="button" data-index="2" aria-label="明るい日常を開く">
          <img src="assets/element-akarui.png" alt="梯子のそばにいる青い服の人" draggable="false" />
          <span class="fragment__prompt" aria-hidden="true">平和とは？</span>
        </button>
        <button class="fragment fragment--four" type="button" data-index="3" aria-label="大空をとぶ作品を開く">
          <img src="assets/element-tenshi.png" alt="空を飛ぶ天使" draggable="false" />
          <span class="fragment__prompt" aria-hidden="true">平和とは？</span>
        </button>
        <button class="fragment fragment--five" type="button" data-index="4" aria-label="なにげない日常を開く">
          <img src="assets/element-nichijo.png" alt="色の違うリュックを背負った四人" draggable="false" />
          <span class="fragment__prompt" aria-hidden="true">平和とは？</span>
        </button>
        <button class="fragment fragment--six" type="button" data-index="5" aria-label="日常、公園を開く">
          <img src="assets/element-koen.png" alt="桃色のぶらんこ" draggable="false" />
          <span class="fragment__prompt" aria-hidden="true">平和とは？</span>
        </button>
        <button class="fragment fragment--seven" type="button" data-index="6" aria-label="家で過ごす作品を開く">
          <img src="assets/element-ie.png" alt="家で並ぶ子どもと大人" draggable="false" />
          <span class="fragment__prompt" aria-hidden="true">平和とは？</span>
        </button>
        <button class="fragment fragment--eight" type="button" data-index="7" aria-label="楽しい世界へを開く">
          <img src="assets/element-sekai.png" alt="赤い実がついた木" draggable="false" />
          <span class="fragment__prompt" aria-hidden="true">平和とは？</span>
        </button>
        <button class="fragment fragment--nine" type="button" data-index="8" aria-label="新しい家を開く">
          <img src="assets/element-atarashii-ie.png" alt="傾いた茶色い扉" draggable="false" />
          <span class="fragment__prompt" aria-hidden="true">平和とは？</span>
        </button>
        <button class="fragment fragment--ten" type="button" data-index="9" aria-label="幸せな家ぞくを開く"><img src="assets/day2-elements/11-28-51.0.png" alt="幸せな家ぞくを描いた作品シート" draggable="false" /><span class="fragment__prompt" aria-hidden="true">平和とは？</span></button>
        <button class="fragment fragment--eleven" type="button" data-index="10" aria-label="楽しい時間を開く"><img src="assets/day2-elements/11-30-32.0.png" alt="楽しい時間を描いた作品シート" draggable="false" /><span class="fragment__prompt" aria-hidden="true">平和とは？</span></button>

        <button class="fragment fragment--fourteen" type="button" data-index="13" aria-label="いつもの時間を開く"><img src="assets/day2-elements/11-37-44.0.png" alt="いつもの時間を描いた作品シート" draggable="false" /><span class="fragment__prompt" aria-hidden="true">平和とは？</span></button>

        <button class="fragment fragment--seventeen" type="button" data-index="16" aria-label="カラフルな学校を開く"><img src="assets/day2-elements/11-44-47.0.png" alt="カラフルな学校を描いた作品シート" draggable="false" /><span class="fragment__prompt" aria-hidden="true">平和とは？</span></button>
        <button class="fragment fragment--eighteen" type="button" data-index="17" aria-label="赤ちゃん生まれたを開く"><img src="assets/day2-elements/14-33-30.0.png" alt="赤ちゃん生まれたを描いた作品シート" draggable="false" /><span class="fragment__prompt" aria-hidden="true">平和とは？</span></button>
        <button class="fragment fragment--nineteen" type="button" data-index="18" aria-label="GWに発見を開く"><img src="assets/day2-elements/14-35-42.0.png" alt="GWに発見を描いた作品シート" draggable="false" /><span class="fragment__prompt" aria-hidden="true">平和とは？</span></button>
        <button class="fragment fragment--twenty" type="button" data-index="19" aria-label="みんなでお見舞いを開く"><img src="assets/day2-elements/14-39-02.0.png" alt="みんなでお見舞いを描いた作品シート" draggable="false" /><span class="fragment__prompt" aria-hidden="true">平和とは？</span></button>
        <button class="fragment fragment--twentyone" type="button" data-index="20" aria-label="はたらきに行く大人を開く"><img src="assets/day2-elements/14-40-55.0.png" alt="はたらきに行く大人を描いた作品シート" draggable="false" /><span class="fragment__prompt" aria-hidden="true">平和とは？</span></button>
        <button class="fragment fragment--twentytwo" type="button" data-index="21" aria-label="すてきな学校にするを開く"><img src="assets/day2-elements/14-43-10.0.png" alt="すてきな学校にするを描いた作品シート" draggable="false" /><span class="fragment__prompt" aria-hidden="true">平和とは？</span></button>
      </div>
    </main>

    <section class="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" aria-hidden="true" tabindex="-1" aria-label="もう一度クリックすると画布に戻ります">
      <div class="detail__content">
        <h1 id="detail-title">
          <span class="detail__prompt">平和とは</span>
          <span class="detail__answer" id="detail-answer"></span>
        </h1>

        <div class="detail__art-frame">
          <img class="detail__art" id="detail-art" alt="" />
        </div>

        <div class="detail__note-frame">
          <img class="detail__note" id="detail-note" alt="" />
        </div>
      </div>
    </section>
  </body>
</html>
