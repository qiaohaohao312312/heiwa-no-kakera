<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="作品の中の小さな要素から、それぞれの平和をひらく。" />
    <title>平和とは — 無限の画布</title>
    <link rel="stylesheet" href="styles.css?v=20261128-6" />
    <script src="script.js?v=20261128-6" defer></script>
  </head>
  <body>
    <main
      class="viewport"
      tabindex="0"
      aria-label="九つの作品の要素が散らばる画布。ドラッグして移動できます。"
    >
      <p class="instruction" aria-hidden="true">ドラッグして見る　·　作品を選ぶ</p>

      <div class="world" aria-label="九つの作品">
        <button class="fragment fragment--one" type="button" data-index="0" aria-label="幸せな家族を開く">
          <img src="assets/element-kazoku.png" alt="紫色の服を着た人" draggable="false" />
          <span class="fragment__prompt" aria-hidden="true">平和とは</span>
        </button>
        <button class="fragment fragment--two" type="button" data-index="1" aria-label="平和な青空を開く">
          <img src="assets/element-aozora.png" alt="黄色い服を着た人" draggable="false" />
          <span class="fragment__prompt" aria-hidden="true">平和とは</span>
        </button>
        <button class="fragment fragment--three" type="button" data-index="2" aria-label="明るい日常を開く">
          <img src="assets/element-akarui.png" alt="梯子のそばにいる青い服の人" draggable="false" />
          <span class="fragment__prompt" aria-hidden="true">平和とは</span>
        </button>
        <button class="fragment fragment--four" type="button" data-index="3" aria-label="大空を飛ぶ天使を開く">
          <img src="assets/element-tenshi.png" alt="空を飛ぶ天使" draggable="false" />
          <span class="fragment__prompt" aria-hidden="true">平和とは</span>
        </button>
        <button class="fragment fragment--five" type="button" data-index="4" aria-label="なにげない日常を開く">
          <img src="assets/element-nichijo.png" alt="色の違うリュックを背負った四人" draggable="false" />
          <span class="fragment__prompt" aria-hidden="true">平和とは</span>
        </button>
        <button class="fragment fragment--six" type="button" data-index="5" aria-label="平和な日常、公園を開く">
          <img src="assets/element-koen.png" alt="桃色のぶらんこ" draggable="false" />
          <span class="fragment__prompt" aria-hidden="true">平和とは</span>
        </button>
        <button class="fragment fragment--seven" type="button" data-index="6" aria-label="平和な家を開く">
          <img src="assets/element-ie.png" alt="家で並ぶ子どもと大人" draggable="false" />
          <span class="fragment__prompt" aria-hidden="true">平和とは</span>
        </button>
        <button class="fragment fragment--eight" type="button" data-index="7" aria-label="楽しい世界へを開く">
          <img src="assets/element-sekai.png" alt="赤い実がついた木" draggable="false" />
          <span class="fragment__prompt" aria-hidden="true">平和とは</span>
        </button>
        <button class="fragment fragment--nine" type="button" data-index="8" aria-label="新しい家を開く">
          <img src="assets/element-atarashii-ie.png" alt="傾いた茶色い扉" draggable="false" />
          <span class="fragment__prompt" aria-hidden="true">平和とは</span>
        </button>
      </div>
    </main>

    <section class="detail" role="dialog" aria-modal="true" aria-labelledby="detail-title" aria-hidden="true" tabindex="-1" aria-label="もう一度クリックすると画布に戻ります">
      <div class="detail__content">
        <h1 id="detail-title">
          <span class="detail__prompt">平和とは</span>
          <span class="detail__answer" id="detail-answer"></span>
        </h1>

        <div class="detail__art-frame">
          <img class="detail__art" id="detail-art" alt="" />
        </div>

        <div class="detail__note-frame">
          <img class="detail__note" id="detail-note" alt="" />
        </div>
      </div>
    </section>
  </body>
</html>
